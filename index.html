<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalissa Nail Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: linear-gradient(135deg, #fdf6f3 0%, #fceef0 45%, #f7e3e9 100%);
      color: #4a3b3e;
      text-align: center;
      padding: 24px;
    }

    .kart {
      max-width: 560px;
    }

    .logo-isaret {
      font-size: 44px;
      letter-spacing: 6px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 56px);
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 span {
      color: #c98a9d;
    }

    .cizgi {
      width: 70px;
      height: 1px;
      background: #c98a9d;
      margin: 26px auto;
    }

    p.slogan {
      font-size: 17px;
      letter-spacing: 2px;
      color: #8a7378;
      font-style: italic;
    }

    p.yakinda {
      margin-top: 34px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #b09399;
    }
  </style>
</head>
<body>
  <main class="kart">
    <div class="logo-isaret">✦</div>
    <h1>Kalissa <span>Nail Art</span></h1>
    <div class="cizgi"></div>
    <p class="slogan">Tırnaklarınızda sanatın dokunuşu</p>
    <p class="yakinda">Çok yakında</p>
  </main>
</body>
</html>
